aid: darwin
name: Darwin
description: >-
  Darwin AI is an AI governance platform built exclusively for state, local, and
  education (SLED) government agencies, providing a centralized, secure hub for
  the public sector to safely adopt, manage, and govern AI tools while ensuring
  compliance, accountability, and public records requirements are met. The
  platform serves IT departments, innovation and digital services teams,
  city and county management, and data governance professionals across municipal
  and state government. Its core product surface includes the Control Center,
  which delivers cross-departmental visibility into AI usage along with records
  management and FOIA compliance tracking; the Policy Wizard, which helps agencies
  establish and refine AI policies aligned to regulatory requirements using 30+
  policy frameworks and 15+ city and county regulation packs; Risk Management,
  which detects unauthorized or unvetted AI applications; the AI Navigator, which
  monitors departmental adoption patterns and surfaces actionable insights; and
  the Marketplace, an organization-wide hub of approved AI applications. Darwin AI
  was named to Government Technology's 2026 GovTech 100. The company also publishes
  a free public Policy Wizard tool. Darwin is backed by Insight Partners and was
  added to the API Evangelist network as a government-sector company profile. As of
  this enrichment pass Darwin publishes no public API, developer portal, SDKs, or
  OpenAPI, so this profile captures identity and domain-security posture only.
